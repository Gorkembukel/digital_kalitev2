name: digital_kalitev2
description: "VitrA Karo SPC Kalite Kontrol Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI & Charts
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0

  # State Management
  provider: ^6.1.2

  # Network (client tarafı)
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Database — pure Dart, native plugin gerektirmez
  hive: ^2.2.3

  # HTTP Server
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^2.0.0
  shelf_cors_headers: ^0.1.5

  # Email
  mailer: ^6.1.0

  # XLSX reader — pure Dart, native plugin gerektirmez
  excel: ^4.0.0

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
